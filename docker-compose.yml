# OPTIONAL: local PostgreSQL + PostGIS for development.
# Credentials match backend/.env.example. Not required to start the backend.
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: namma-suvidha-db
    environment:
      POSTGRES_USER: namma
      POSTGRES_PASSWORD: namma_dev_password
      POSTGRES_DB: namma_suvidha
    ports:
      - "5432:5432"
    volumes:
      - namma_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U namma -d namma_suvidha"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  namma_pgdata:

