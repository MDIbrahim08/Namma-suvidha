<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, initial-scale=1" />
<title>Namma Suvidha — Logo Reveal</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100vw; height: 100vh;
    background: #ffffff;
    overflow: hidden;
    font-family: 'Noto Sans Kannada', 'Noto Serif Kannada', sans-serif;
  }

  /* ─── Stage ─────────────────────────────────────── */
  #stage {
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }

  /* ─── Main SVG ───────────────────────────────────── */
  #logo-svg {
    width: min(85vw, 650px);
    height: auto;
    overflow: visible;
  }

  /* ════════════════════════════════════════════════════
     PIN BODY — drawn from bottom upward via stroke-dasharray
  ════════════════════════════════════════════════════ */
  .pin-outline {
    fill: none;
    stroke: #1a3d7c;
    stroke-width: 3.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    /* Total path length computed in JS and set as custom property */
    stroke-dasharray: var(--pin-len, 900);
    stroke-dashoffset: var(--pin-len, 900);
    animation: draw-pin 0.85s cubic-bezier(0.22, 1, 0.36, 1) 0.15s forwards;
  }
  .pin-fill {
    fill: #1a3d7c;
    opacity: 0;
    animation: fill-fade 0.4s ease-out 0.85s forwards;
  }

  @keyframes draw-pin {
    to { stroke-dashoffset: 0; }
  }
  @keyframes fill-fade {
    to { opacity: 1; }
  }

  /* ─── Icons inside pin ───────────────────────────── */
  .pin-icons {
    opacity: 0;
    transform-origin: 50% 40%;
    transform-box: fill-box;
    animation: icon-in 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) 1.05s forwards;
  }
  @keyframes icon-in {
    0%  { opacity: 0; transform: scale(0.6); }
    100%{ opacity: 1; transform: scale(1); }
  }

  /* ─── Ground line ────────────────────────────────── */
  .ground-line {
    fill: none;
    stroke: #2a9d4e;
    stroke-width: 4.5;
    stroke-linecap: round;
    stroke-dasharray: var(--gnd-len, 260);
    stroke-dashoffset: var(--gnd-len, 260);
    animation: draw-ground 0.55s cubic-bezier(0.4, 0, 0.2, 1) 1.35s forwards;
  }
  @keyframes draw-ground {
    to { stroke-dashoffset: 0; }
  }

  /* ─── Leaves ─────────────────────────────────────── */
  .leaf {
    opacity: 0;
    transform-box: fill-box;
  }
  .leaf-left {
    transform-origin: 90% 90%;
    animation: leaf-grow 0.5s cubic-bezier(0.34, 1.45, 0.64, 1) 1.72s forwards;
  }
  .leaf-right {
    transform-origin: 10% 90%;
    animation: leaf-grow 0.5s cubic-bezier(0.34, 1.45, 0.64, 1) 1.88s forwards;
  }
  @keyframes leaf-grow {
    0%  { opacity: 0; transform: scale(0) rotate(12deg); }
    60% { opacity: 1; }
    100%{ opacity: 1; transform: scale(1) rotate(0deg); }
  }

  /* ─── Text group ─────────────────────────────────── */
  .text-group {
    opacity: 0;
    animation: text-reveal 0.7s cubic-bezier(0.22, 1, 0.36, 1) 2.25s forwards;
  }
  @keyframes text-reveal {
    0%  { opacity: 0; transform: translateX(-14px); }
    100%{ opacity: 1; transform: translateX(0); }
  }

  /* ─── Shine overlay ──────────────────────────────── */
  .shine-group {
    opacity: 0;
    animation: shine-sweep 0.9s ease-out 3.0s forwards;
  }
  @keyframes shine-sweep {
    0%  { opacity: 0; }
    30% { opacity: 0.18; }
    100%{ opacity: 0; }
  }

  /* ─── Final settle ───────────────────────────────── */
  #logo-svg {
    animation: settle 0.6s cubic-bezier(0.22, 1, 0.36, 1) 3.55s both;
  }
  @keyframes settle {
    0%  { transform: translateY(4px); }
    100%{ transform: translateY(0px); }
  }
</style>
<!-- Google Fonts – Kannada support -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Kannada:wght@400;700;800&family=Noto+Serif+Kannada:wght@700&display=swap" rel="stylesheet">
</head>
<body>
<div id="stage">

<!--
  ══════════════════════════════════════════════════════════
  NAMMA SUVIDHA — LOGO REVEAL SVG
  ViewBox is set to 400 × 320.  All co-ordinates below are
  in that user-space.  The HTML wrapper scales to 780 px wide.
  ══════════════════════════════════════════════════════════

  Layout (centred on x=200):
    • Pin body       top: ~10   bottom: ~175  width: ~90
    • Ground line    y ≈ 188
    • Leaves         y ≈ 183–205
    • Text block     y ≈ 225–305
-->

<svg id="logo-svg" viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="Namma Suvidha logo">
  <defs>
    <!-- Linear gradient for pin fill — navy top, slightly lighter navy bottom -->
    <linearGradient id="pin-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1a3d7c"/>
      <stop offset="100%" stop-color="#14306a"/>
    </linearGradient>

    <!-- Shine gradient sweeping left-to-right -->
    <linearGradient id="shine-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="white" stop-opacity="0"/>
      <stop offset="45%"  stop-color="white" stop-opacity="0.35"/>
      <stop offset="55%"  stop-color="white" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>

    <!-- Clip path for shine — restricted to logo bounding box -->
    <clipPath id="logo-clip">
      <rect x="105" y="5" width="190" height="310"/>
    </clipPath>

    <!-- Leaf gradient — deep to medium green -->
    <linearGradient id="leaf-grad-l" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2a9d4e"/>
      <stop offset="100%" stop-color="#1e7a3b"/>
    </linearGradient>
    <linearGradient id="leaf-grad-r" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#2a9d4e"/>
      <stop offset="100%" stop-color="#1e7a3b"/>
    </linearGradient>
  </defs>

  <!-- ══════════════════════════════════════════════════
       1. PIN BODY
       Classic teardrop / location-pin shape.
       Drawn as a single closed path so the stroke-dasharray
       animation traces the full outline from the tip upward.
       The path starts at the bottom tip (200, 175) and goes
       clockwise, so the stroke animates bottom → sides → top.
  ══════════════════════════════════════════════════════ -->

  <!-- Fill layer (fades in after stroke finishes) -->
  <path class="pin-fill"
    d="M200,175
       C200,175 127,128 122,85
       C117,42 155,12 200,12
       C245,12 283,42 278,85
       C273,128 200,175 200,175 Z"
    fill="url(#pin-grad)"
  />

  <!-- Stroke layer for draw-on animation -->
  <path class="pin-outline" id="pin-path"
    d="M200,175
       C200,175 127,128 122,85
       C117,42 155,12 200,12
       C245,12 283,42 278,85
       C273,128 200,175 200,175 Z"
  />

  <!-- ══════════════════════════════════════════════════
       2. ICONS INSIDE PIN — male & female silhouettes
       Positioned in the upper half of the pin (centred ~200,90)
  ══════════════════════════════════════════════════════ -->
  <g class="pin-icons">

    <!-- ── Female figure (left side, x≈185) ── -->
    <g fill="white" transform="translate(163, 32)">
      <!-- Head circle -->
      <circle cx="18" cy="12" r="9"/>
      <!-- Body / dress trapezoid -->
      <path d="M7,25 Q9,22 18,22 Q27,22 29,25 L33,58 Q26,62 18,62 Q10,62 3,58 Z"/>
      <!-- Arms -->
      <path d="M7,27 L0,44 Q2,46 4,45 L10,32 Z" opacity="0.9"/>
      <path d="M29,27 L36,44 Q34,46 32,45 L26,32 Z" opacity="0.9"/>
    </g>

    <!-- ── Divider line ── -->
    <line x1="200" y1="36" x2="200" y2="95" stroke="white" stroke-width="1.5" opacity="0.5"/>

    <!-- ── Male figure (right side, x≈215) ── -->
    <g fill="white" transform="translate(200, 32)">
      <!-- Head circle -->
      <circle cx="18" cy="12" r="9"/>
      <!-- Body / shirt rectangle -->
      <path d="M9,25 Q9,22 18,22 Q27,22 27,25 L27,52 L9,52 Z"/>
      <!-- Trousers -->
      <path d="M9,50 L9,62 L15,62 L18,54 L21,62 L27,62 L27,50 Z"/>
      <!-- Arms -->
      <path d="M9,27 L2,42 Q4,44 6,43 L12,30 Z" opacity="0.9"/>
      <path d="M27,27 L34,42 Q32,44 30,43 L24,30 Z" opacity="0.9"/>
    </g>

  </g>

  <!-- ══════════════════════════════════════════════════
       3. GREEN CURVED GROUND LINE
       A gentle upward-curving arc beneath the pin tip,
       sweeping left-to-right via stroke-dashoffset.
  ══════════════════════════════════════════════════════ -->
  <path class="ground-line" id="ground-path"
    d="M138,188 Q200,178 262,188"
    fill="none"
  />

  <!-- ══════════════════════════════════════════════════
       4. TWO GREEN LEAVES
       Leaf left: grows from the left junction of ground line
       Leaf right: grows from the right junction
  ══════════════════════════════════════════════════════ -->

  <!-- Left leaf -->
  <g class="leaf leaf-left">
    <path
      d="M152,188
         C146,172 130,165 122,155
         C128,168 138,176 152,188 Z"
      fill="url(#leaf-grad-l)"
    />
    <!-- Midrib -->
    <line x1="152" y1="188" x2="130" y2="160"
          stroke="#1e7a3b" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Right leaf -->
  <g class="leaf leaf-right">
    <path
      d="M248,188
         C254,172 270,165 278,155
         C272,168 262,176 248,188 Z"
      fill="url(#leaf-grad-r)"
    />
    <!-- Midrib -->
    <line x1="248" y1="188" x2="270" y2="160"
          stroke="#1e7a3b" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- ══════════════════════════════════════════════════
       5. TEXT BLOCK
       Top row: Kannada name  "ನಮ್ಮ ಸುವಿಧ"  — bold
       Bottom row: "Suvidha"  in English — lighter weight
       Both treated as fixed graphic elements; animated
       with a simple left-to-right fade only.
  ══════════════════════════════════════════════════════ -->
  <g class="text-group">

    <!-- Kannada heading: ನಮ್ಮ ಸುವಿಧ -->
    <text
      x="200" y="238"
      text-anchor="middle"
      font-family="'Noto Serif Kannada', 'Noto Sans Kannada', serif"
      font-size="36"
      font-weight="700"
      fill="#1a3d7c"
      letter-spacing="1"
    >ನಮ್ಮ ಸುವಿಧ</text>

    <!-- Subtitle: Suvidha in English -->
    <text
      x="200" y="272"
      text-anchor="middle"
      font-family="'Noto Sans Kannada', sans-serif"
      font-size="22"
      font-weight="400"
      fill="#2a9d4e"
      letter-spacing="4"
    >SUVIDHA</text>

    <!-- Thin decorative rule below text -->
    <line x1="148" y1="282" x2="252" y2="282"
          stroke="#2a9d4e" stroke-width="1" opacity="0.45"/>

    <!-- Tagline -->
    <text
      x="200" y="300"
      text-anchor="middle"
      font-family="sans-serif"
      font-size="11"
      font-weight="400"
      fill="#666"
      letter-spacing="2.5"
    >PUBLIC WASHROOM NETWORK</text>

  </g>

  <!-- ══════════════════════════════════════════════════
       6. SHINE OVERLAY (subtle, one-pass, clipped to logo)
  ══════════════════════════════════════════════════════ -->
  <g class="shine-group" clip-path="url(#logo-clip)">
    <rect x="-50" y="0" width="500" height="320"
          fill="url(#shine-grad)" opacity="1"/>
  </g>

</svg>
</div>

<script>
  // ── Measure actual path lengths and set CSS custom properties ──────────────
  window.addEventListener('DOMContentLoaded', () => {
    const pinPath = document.getElementById('pin-path');
    const groundPath = document.getElementById('ground-path');

    if (pinPath) {
      const len = pinPath.getTotalLength().toFixed(1);
      pinPath.style.setProperty('--pin-len', len);
      pinPath.style.strokeDasharray = len;
      pinPath.style.strokeDashoffset = len;
    }
    if (groundPath) {
      const len = groundPath.getTotalLength().toFixed(1);
      groundPath.style.setProperty('--gnd-len', len);
      groundPath.style.strokeDasharray = len;
      groundPath.style.strokeDashoffset = len;
    }
  });
</script>
</body>
</html>
